<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #171717;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
      --soft: #f7f7f2;
      --green: #1f7a4d;
      --amber: #b7791f;
      --red: #b42318;
      --blue: #2563eb;
      --teal: #0f766e;
      --shadow: 0 8px 24px rgba(17, 24, 39, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-family: Inter, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(17, 24, 39, .04);
    }

    .icon-btn:hover {
      border-color: #c7cbd1;
      box-shadow: var(--shadow);
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      gap: 8px;
    }

    .metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 14px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 74px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric .value {
      margin-top: 7px;
      font-size: 24px;
      font-weight: 750;
      line-height: 1;
    }

    .metric .note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .section {
      margin-top: 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 750;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-row {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
    }

    .bar-row:last-child {
      border-bottom: 0;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .bar-label {
      color: var(--ink);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      height: 7px;
      background: #eef0f2;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 999px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 8px;
      margin-bottom: 8px;
    }

    .field {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 10px;
      outline: none;
    }

    .field:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      background: #fafafa;
      letter-spacing: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .client-name {
      font-weight: 700;
    }

    .sub {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      height: 23px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill.ok {
      color: var(--green);
      background: #ecfdf3;
      border-color: #bbf7d0;
    }

    .pill.warn {
      color: var(--amber);
      background: #fffbeb;
      border-color: #fde68a;
    }

    .pill.bad {
      color: var(--red);
      background: #fff1f2;
      border-color: #fecdd3;
    }

    .pill.neutral {
      color: #374151;
      background: #f3f4f6;
      border-color: #e5e7eb;
    }

    .score {
      font-weight: 800;
      text-align: right;
    }

    .empty {
      padding: 22px 14px;
      color: var(--muted);
      text-align: center;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .log {
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .log:last-child {
      border-bottom: 0;
    }

    .log strong {
      display: block;
      margin-bottom: 3px;
    }

    .log span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .loading {
      opacity: .62;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <h1>Database Influencers</h1>
        <span id="updatedAt">Carregando...</span>
      </div>
      <div class="actions">
        <button class="icon-btn" type="button" title="Configurar estrutura" onclick="setup()">&#9881;</button>
        <button class="icon-btn" type="button" title="Atualizar database" onclick="refreshDatabase()">&#8635;</button>
      </div>
    </header>

    <div class="status" id="status"></div>

    <section class="grid metrics" id="metrics"></section>

    <section class="section split">
      <div>
        <h2 class="section-title">Saude da gestao</h2>
        <div class="panel" id="healthDistribution"></div>
      </div>
      <div>
        <h2 class="section-title">Etapas principais</h2>
        <div class="panel" id="stageDistribution"></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Gestores</h2>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th style="width: 38%">Gestor</th>
              <th style="width: 17%">Clientes</th>
              <th style="width: 20%">Infl.</th>
              <th style="width: 25%">Score</th>
            </tr>
          </thead>
          <tbody id="managerRows"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Clientes em atencao</h2>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th style="width: 52%">Cliente</th>
              <th style="width: 23%">Saude</th>
              <th style="width: 25%">Score</th>
            </tr>
          </thead>
          <tbody id="riskRows"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Clientes</h2>
      <div class="filters">
        <input class="field" id="search" type="search" placeholder="Buscar cliente ou gestor" oninput="renderClients()">
        <select class="field" id="healthFilter" onchange="renderClients()">
          <option value="">Todos</option>
          <option value="Forte">Forte</option>
          <option value="Ativo">Ativo</option>
          <option value="Em Atencao">Em Atencao</option>
          <option value="Critico">Critico</option>
        </select>
      </div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th style="width: 48%">Cliente</th>
              <th style="width: 22%">Saude</th>
              <th style="width: 15%">Infl.</th>
              <th style="width: 15%">Score</th>
            </tr>
          </thead>
          <tbody id="clientRows"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Historico</h2>
      <div class="panel" id="logRows"></div>
    </section>
  </main>

  <script>
    const state = {
      data: null,
      busy: false
    };

    const $ = function (id) {
      return document.getElementById(id);
    };

    function setBusy(isBusy, message) {
      state.busy = isBusy;
      $('app').classList.toggle('loading', isBusy);
      $('status').textContent = message || '';
    }

    function loadData() {
      setBusy(true, 'Carregando painel...');
      google.script.run
        .withSuccessHandler(function (data) {
          state.data = data;
          setBusy(false, '');
          render();
        })
        .withFailureHandler(function (error) {
          setBusy(false, 'Erro: ' + error.message);
        })
        .getDatabaseInfluencersDashboardData();
    }

    function refreshDatabase() {
      setBusy(true, 'Atualizando database...');
      google.script.run
        .withSuccessHandler(function (result) {
          setBusy(false, result.message || 'Atualizado.');
          loadData();
        })
        .withFailureHandler(function (error) {
          setBusy(false, 'Erro: ' + error.message);
        })
        .atualizarDatabaseCentralInfluencers();
    }

    function setup() {
      setBusy(true, 'Configurando estrutura...');
      google.script.run
        .withSuccessHandler(function (result) {
          setBusy(false, result.message || 'Estrutura pronta.');
          loadData();
        })
        .withFailureHandler(function (error) {
          setBusy(false, 'Erro: ' + error.message);
        })
        .configurarDatabaseCentralInfluencers();
    }

    function render() {
      if (!state.data) return;
      $('updatedAt').textContent = 'Atualizado em ' + state.data.generatedAt;
      renderMetrics();
      renderDistribution('healthDistribution', state.data.healthDistribution, 'health');
      renderDistribution('stageDistribution', state.data.stageDistribution, 'stage');
      renderManagers();
      renderRiskRows();
      renderClients();
      renderLogs();
    }

    function renderMetrics() {
      const metrics = state.data.metrics || {};
      const cards = [
        ['Clientes', metrics.clients || 0, 'carteira central'],
        ['Influencers', metrics.influencers || 0, 'linhas consolidadas'],
        ['Score medio', metrics.score || 0, '0 a 100'],
        ['Atrasados', metrics.overdue || 0, 'follow-ups vencidos'],
        ['Ativos', metrics.active || 0, 'gestao em movimento'],
        ['Concluidos', metrics.done || 0, 'resultado registrado']
      ];

      $('metrics').innerHTML = cards.map(function (card) {
        return '<article class="metric">' +
          '<div class="label">' + escapeHtml(card[0]) + '</div>' +
          '<div class="value">' + escapeHtml(card[1]) + '</div>' +
          '<div class="note">' + escapeHtml(card[2]) + '</div>' +
        '</article>';
      }).join('');
    }

    function renderDistribution(targetId, rows, mode) {
      const target = $(targetId);
      if (!rows || !rows.length) {
        target.innerHTML = '<div class="empty">Sem dados.</div>';
        return;
      }

      target.innerHTML = rows.map(function (row) {
        const color = mode === 'health' ? healthColor(row.label) : 'var(--teal)';
        return '<div class="bar-row">' +
          '<div class="bar-head">' +
            '<span class="bar-label">' + escapeHtml(row.label) + '</span>' +
            '<span>' + escapeHtml(row.count) + ' · ' + escapeHtml(row.percent) + '%</span>' +
          '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + clamp(row.percent, 1, 100) + '%;background:' + color + '"></div></div>' +
        '</div>';
      }).join('');
    }

    function renderManagers() {
      const rows = (state.data.managers || []).slice(0, 10);
      $('managerRows').innerHTML = rows.length ? rows.map(function (row) {
        return '<tr>' +
          '<td><span class="client-name">' + escapeHtml(row.Gestor) + '</span><span class="sub">' + escapeHtml(row.Atrasados || 0) + ' atrasados · ' + escapeHtml(row.Concluidos || 0) + ' concluidos</span></td>' +
          '<td>' + escapeHtml(row.Clientes || 0) + '</td>' +
          '<td>' + escapeHtml(row.Influencers || 0) + '</td>' +
          '<td class="score">' + escapeHtml(row.Score || 0) + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="4"><div class="empty">Sem gestores.</div></td></tr>';
    }

    function renderRiskRows() {
      const rows = (state.data.riskyClients || []).slice(0, 8);
      $('riskRows').innerHTML = rows.length ? rows.map(function (row) {
        return '<tr>' +
          '<td><span class="client-name">' + escapeHtml(row.Cliente) + '</span><span class="sub">' + escapeHtml(row.Gestor) + ' · ' + escapeHtml(row['Principais Sinais']) + '</span></td>' +
          '<td>' + pill(row.Saude) + '</td>' +
          '<td class="score">' + escapeHtml(row['Score Medio']) + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="3"><div class="empty">Sem clientes em risco.</div></td></tr>';
    }

    function renderClients() {
      if (!state.data) return;
      const search = normalize($('search').value);
      const health = $('healthFilter').value;
      const rows = (state.data.clients || []).filter(function (row) {
        const text = normalize(row.Cliente + ' ' + row.Gestor + ' ' + row.Saude);
        const matchesSearch = !search || text.indexOf(search) >= 0;
        const matchesHealth = !health || row.Saude === health;
        return matchesSearch && matchesHealth;
      }).slice(0, 60);

      $('clientRows').innerHTML = rows.length ? rows.map(function (row) {
        return '<tr>' +
          '<td><span class="client-name">' + escapeHtml(row.Cliente) + '</span><span class="sub">' + escapeHtml(row.Gestor) + ' · ultima acao: ' + escapeHtml(row['Ultima Acao'] || '-') + '</span></td>' +
          '<td>' + pill(row.Saude) + '</td>' +
          '<td>' + escapeHtml(row.Influencers || 0) + '</td>' +
          '<td class="score">' + escapeHtml(row['Score Medio'] || 0) + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="4"><div class="empty">Nenhum cliente encontrado.</div></td></tr>';
    }

    function renderLogs() {
      const rows = state.data.recentLogs || [];
      $('logRows').innerHTML = rows.length ? rows.map(function (row) {
        return '<div class="log">' +
          '<strong>' + escapeHtml(row.Acao || 'Atualizacao') + ' · ' + escapeHtml(row.Status || '') + '</strong>' +
          '<span>' + escapeHtml(row.Timestamp || '') + ' · ' + escapeHtml(row.Gestor || '-') + ' · ' + escapeHtml(row.Cliente || '-') + '</span>' +
          '<span>' + escapeHtml(row.Detalhes || '') + '</span>' +
        '</div>';
      }).join('') : '<div class="empty">Sem historico.</div>';
    }

    function pill(value) {
      const label = value || 'Sem Dados';
      const css = healthClass(label);
      return '<span class="pill ' + css + '">' + escapeHtml(label) + '</span>';
    }

    function healthClass(value) {
      const normalized = normalize(value);
      if (normalized === 'forte' || normalized === 'ativo') return 'ok';
      if (normalized === 'em atencao') return 'warn';
      if (normalized === 'critico' || normalized === 'atrasado') return 'bad';
      return 'neutral';
    }

    function healthColor(value) {
      const normalized = normalize(value);
      if (normalized === 'ativo' || normalized === 'forte' || normalized === 'concluido') return 'var(--green)';
      if (normalized === 'em atencao') return 'var(--amber)';
      if (normalized === 'critico' || normalized === 'atrasado') return 'var(--red)';
      return 'var(--blue)';
    }

    function normalize(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function clamp(value, min, max) {
      const number = Number(value) || 0;
      return Math.max(min, Math.min(max, number));
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadData();
  </script>
</body>
</html>
